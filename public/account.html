<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KUSA FlightOps — Sign In</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#071b33;color:#e8f1fb;display:flex;align-items:center;justify-content:center;padding:28px}
.card{width:min(720px,100%);background:#0d2b4b;border:1px solid #31506f;border-radius:16px;padding:26px;box-shadow:0 18px 55px rgba(0,0,0,.25)}
h1{margin:0 0 6px;font-size:28px}.sub{color:#a9bed3;margin:0 0 22px}
label{display:block;color:#cfe1f3;font-size:13px;font-weight:700;margin:12px 0 6px}
input,button{width:100%;padding:12px;border-radius:8px;border:1px solid #31506f;background:#061829;color:#fff;font:inherit}
button{background:#215d95;font-weight:700;cursor:pointer;margin-top:12px}
button.secondary{background:#061829}button:disabled{opacity:.5;cursor:not-allowed}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status{font-weight:700;margin:16px 0 0}.ok{color:#47e6a5}.bad{color:#ff6b6b}
.session{margin-top:18px;padding:14px;background:#061829;border:1px solid #31506f;border-radius:10px}
.hidden{display:none}.muted{color:#9db2c7}.pill{display:inline-block;border:1px solid #31506f;border-radius:999px;padding:4px 8px;margin:2px 4px 2px 0;font-size:12px}
@media(max-width:620px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="card">
  <h1>KUSA FlightOps</h1>
  <p class="sub">Secure account access · v5.26.11</p>

  <div style="margin-bottom:14px">
    <button id="backToApp" class="secondary" type="button">← Back to FlightOps</button>
  </div>

  <div id="loginPane">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" autofocus>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="login">Sign In</button>
  </div>

  <div id="sessionPane" class="session hidden">
    <strong id="who"></strong>
    <div id="memberships" class="muted" style="margin-top:6px"></div>
    <div id="aircraft" style="margin-top:8px"></div>
    <div class="row" style="margin-top:12px">
      <button id="continueBtn">Continue to FlightOps</button>
      <button id="adminBtn" class="secondary hidden">User Administration</button>
    </div>
    <div class="session" style="margin-top:14px">
      <strong>Trusted Offline Device</strong>
      <div id="offlineState" class="muted" style="margin-top:6px">Checking device authorization...</div>
      <div class="row" style="margin-top:10px">
        <button id="offlineEnroll">Authorize This Device</button>
        <button id="offlineRevoke" class="secondary hidden">Revoke This Device</button>
      </div>
    </div>
    <button id="logout" class="secondary">Sign Out</button>
  </div>

  <div id="status" class="status"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
const next=qs.get('next')||'/';

function preservePreview(url){
  const share=location.hostname.includes('.preview.')?qs.get('airoShareToken'):null;
  if(!share)return url;
  const u=new URL(url,location.origin);
  if(!u.searchParams.get('airoShareToken'))u.searchParams.set('airoShareToken',share);
  return u.pathname+u.search+u.hash;
}
function setStatus(msg,ok=true){
  $('status').className='status '+(ok?'ok':'bad');
  $('status').textContent=msg||'';
}
function getOfflineDeviceKey(){
  let k=localStorage.getItem('kusa_offline_device_key');
  if(!k){
    const b=new Uint8Array(24);crypto.getRandomValues(b);
    k=btoa(String.fromCharCode(...b)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    localStorage.setItem('kusa_offline_device_key',k);
  }
  return k;
}
function offlineGrant(){
  try{return JSON.parse(localStorage.getItem('kusa_offline_grant')||'null')}catch{return null}
}
async function postToServiceWorker(message){
  if(!('serviceWorker' in navigator))return false;
  try{
    const reg=await navigator.serviceWorker.ready;
    const target=navigator.serviceWorker.controller||reg.active||reg.waiting;
    if(!target)return false;
    target.postMessage(message);
    return true;
  }catch{return false}
}
async function syncOfflineGrantToServiceWorker(){
  const g=offlineGrant();
  if(!g){await postToServiceWorker({type:'KUSA_OFFLINE_REVOKE'});return}
  await postToServiceWorker({type:'KUSA_OFFLINE_GRANT',grant:{token:g.token,expires_at:g.expires_at,device_id:g.device_id,device_key:g.device_key,public_key:g.public_key,build:g.build||'5.26.11'}});
}
function renderOfflineState(){
  const g=offlineGrant();
  if(!g){
    $('offlineState').textContent='This browser has not been authorized for offline use.';
    $('offlineRevoke').classList.add('hidden');
    return;
  }
  const exp=new Date(g.expires_at),valid=Number.isFinite(exp.getTime())&&exp.getTime()>Date.now();
  $('offlineState').textContent=valid
    ? `Authorized through ${exp.toLocaleString()}. Secure offline shell is enabled on this trusted browser.`
    : `Offline authorization expired ${Number.isFinite(exp.getTime())?exp.toLocaleString():''}. Re-authorize this device.`;
  $('offlineRevoke').classList.toggle('hidden',!g.device_id);
}

function renderSession(j){
  const admin=Array.isArray(j.memberships)&&j.memberships.some(m=>m.role==='administrator');
  $('loginPane').classList.add('hidden');
  $('sessionPane').classList.remove('hidden');
  $('who').textContent=`${j.user.display_name} · ${j.user.email}`;
  $('memberships').textContent=(j.memberships||[]).map(m=>`${m.name} — ${m.role}`).join(' · ');
  $('aircraft').innerHTML=(j.aircraft||[]).map(a=>`<span class="pill">${a.registration} · ${a.model}</span>`).join('');
  $('adminBtn').classList.toggle('hidden',!admin);
  renderOfflineState();
  setStatus('Authenticated session active.',true);
}
async function checkSession(){
  try{
    const r=await fetch('/api/me',{credentials:'same-origin',cache:'no-store'});
    const j=await r.json();
    if(r.ok){renderSession(j);return true}
  }catch{}
  $('loginPane').classList.remove('hidden');
  $('sessionPane').classList.add('hidden');
  setStatus('',true);
  return false;
}
$('login').onclick=async()=>{
  $('login').disabled=true;
  try{
    const r=await fetch('/api/auth/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      credentials:'same-origin',
      body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})
    });
    const j=await r.json();
    if(!r.ok){setStatus(j.error==='INVALID_CREDENTIALS'?'Invalid email or password.':`Sign in failed: ${j.error||r.status}`,false);return}
    const me=await fetch('/api/me',{credentials:'same-origin',cache:'no-store'});
    const mj=await me.json();
    if(me.ok)renderSession(mj);
    if(next && next!=='/account.html'){
      setTimeout(()=>{location.href=preservePreview(next)},250);
    }
  }catch(e){setStatus(`Sign in failed: ${e}`,false)}
  finally{$('login').disabled=false}
};
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('login').click()});
$('backToApp').onclick=()=>{location.href=preservePreview(next&&next!=='/account.html'?next:'/')};
$('continueBtn').onclick=()=>{location.href=preservePreview(next&&next!=='/account.html'?next:'/')};
$('adminBtn').onclick=()=>{location.href=preservePreview('/admin-users.html')};
$('offlineEnroll').onclick=async()=>{
  $('offlineEnroll').disabled=true;
  try{
    const device_key=getOfflineDeviceKey();
    const label=`${navigator.platform||'Browser'} · ${navigator.userAgent.includes('Chrome')?'Chrome':'Browser'}`;
    const r=await fetch('/api/offline/enroll',{
      method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',
      body:JSON.stringify({device_key,label})
    });
    const j=await r.json();
    if(!r.ok){setStatus(`Offline authorization failed: ${j.error||r.status}`,false);return}
    localStorage.setItem('kusa_offline_grant',JSON.stringify({
      token:j.grant.token,expires_at:j.grant.expires_at,device_id:j.device.id,device_key:j.device.key,
      public_key:j.public_key,build:'5.26.11'
    }));
    await syncOfflineGrantToServiceWorker();
    renderOfflineState();
    setStatus('This browser is now a trusted offline device and the secure offline shell is enabled.',true);
  }catch(e){setStatus(`Offline authorization failed: ${e}`,false)}
  finally{$('offlineEnroll').disabled=false}
};
$('offlineRevoke').onclick=async()=>{
  const g=offlineGrant();
  if(!g?.device_id)return;
  if(!confirm('Revoke offline authorization for this browser?'))return;
  try{
    const r=await fetch(`/api/offline/devices/${encodeURIComponent(g.device_id)}/revoke`,{method:'POST',credentials:'same-origin'});
    const j=await r.json();
    if(!r.ok){setStatus(`Revoke failed: ${j.error||r.status}`,false);return}
    localStorage.removeItem('kusa_offline_grant');
    await postToServiceWorker({type:'KUSA_OFFLINE_REVOKE'});
    renderOfflineState();
    setStatus('Offline authorization revoked and the protected offline cache was cleared.',true);
  }catch(e){setStatus(`Revoke failed: ${e}`,false)}
};

$('logout').onclick=async()=>{
  try{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'})}catch{}
  $('sessionPane').classList.add('hidden');
  $('loginPane').classList.remove('hidden');
  $('password').value='';
  setStatus('Signed out.',true);
};
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').then(async()=>{await syncOfflineGrantToServiceWorker()}).catch(()=>{});
}
checkSession();
</script>
</body>
</html>
