<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KUSA FlightOps Account Test</title><style>body{font-family:Arial,sans-serif;background:#071b33;color:#e8f1fb;margin:0;padding:32px}.card{max-width:720px;margin:auto;background:#0d2b4b;border:1px solid #31506f;border-radius:14px;padding:24px}input,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0 14px;border-radius:8px;border:1px solid #31506f;background:#061829;color:white}button{background:#215d95;font-weight:700;cursor:pointer}.ok{color:#47e6a5}.bad{color:#ff6b6b}pre{white-space:pre-wrap;background:#061829;padding:12px;border-radius:8px}</style></head><body><div class="card"><h1>KUSA FlightOps — Account Foundation</h1><p>v5.26.2 platform test page. This is for validating persistent account sessions before mandatory login is enabled.</p><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button id="login">Sign In</button><button id="me">Check Session</button><button id="logout">Sign Out</button><button id="admin" style="display:none">Open User Administration</button><div id="status"></div><pre id="output"></pre></div><script>
const $=id=>document.getElementById(id), out=(v,ok=true)=>{$('status').className=ok?'ok':'bad';$('status').textContent=ok?'OK':'ERROR';$('output').textContent=JSON.stringify(v,null,2)};
$('login').onclick=async()=>{try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email:$('email').value,password:$('password').value})});const j=await r.json();out(j,r.ok)}catch(e){out({error:String(e)},false)}};
$('me').onclick=async()=>{try{const r=await fetch('/api/me',{credentials:'same-origin'});const j=await r.json();out(j,r.ok);$('admin').style.display=(r.ok&&Array.isArray(j.memberships)&&j.memberships.some(m=>m.role==='administrator'))?'block':'none'}catch(e){out({error:String(e)},false)}};
$('logout').onclick=async()=>{try{const r=await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'});const j=await r.json();$('admin').style.display='none';out(j,r.ok)}catch(e){out({error:String(e)},false)}};
$('admin').onclick=()=>{location.href='/admin-users.html'};
</script></body></html>
