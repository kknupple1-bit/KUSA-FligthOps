<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KUSA FlightOps — Password Reset</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color-scheme:dark}
body{margin:0;background:#071b33;color:#e8f1fb}
.wrap{max-width:680px;margin:0 auto;padding:36px 20px}
.card{background:#0d2b4b;border:1px solid #31506f;border-radius:14px;padding:22px}
h1{margin:0 0 8px}.sub,.muted{color:#a9bed3}
label{display:block;margin:14px 0 6px;font-weight:700}
input{box-sizing:border-box;width:100%;background:#061829;color:#fff;border:1px solid #31506f;border-radius:8px;padding:12px;font:inherit}
button{margin-top:16px;width:100%;border:1px solid #31506f;border-radius:8px;background:#215d95;color:#fff;padding:12px;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}.status{font-weight:700;margin:12px 0}.ok{color:#47e6a5}.bad{color:#ff6b6b}.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>KUSA FlightOps</h1>
  <p class="sub">Password recovery · v5.26.14</p>
  <div class="card">
    <div id="status" class="status">Validating reset link...</div>
    <div id="details" class="hidden">
      <p><strong>User:</strong> <span id="user"></span></p>
      <p><strong>Organization:</strong> <span id="org"></span></p>
      <p class="muted">Reset expires <span id="expires"></span>.</p>
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" placeholder="Minimum 12 characters">
      <label for="confirm">Confirm new password</label>
      <input id="confirm" type="password" autocomplete="new-password">
      <button id="save">Set New Password & Sign In</button>
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const token=new URLSearchParams(location.search).get('token')||'';
function withPreviewShareToken(url){
  const share=location.hostname.includes('.preview.')?new URLSearchParams(location.search).get('airoShareToken'):null;
  if(!share)return url;
  const u=new URL(url,location.origin);u.searchParams.set('airoShareToken',share);return u.pathname+u.search;
}
async function api(url,opt={}){
  const r=await fetch(withPreviewShareToken(url),{credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});
  let j={};try{j=await r.json()}catch{}
  if(!r.ok)throw Object.assign(new Error(j.error||`HTTP_${r.status}`),{code:j.error||`HTTP_${r.status}`});
  return j;
}
function fail(msg){$('status').className='status bad';$('status').textContent=msg;$('details').classList.add('hidden')}
async function validate(){
  if(!token)return fail('Reset token is missing.');
  try{
    const j=await api(`/api/password-resets/${encodeURIComponent(token)}`);
    $('status').className='status ok';$('status').textContent='Reset link verified.';
    $('user').textContent=`${j.reset.display_name} (${j.reset.email})`;
    $('org').textContent=j.reset.organization_name||'KUSA Aviation';
    $('expires').textContent=new Date(j.reset.expires_at).toLocaleString();
    $('details').classList.remove('hidden');
  }catch(e){
    const map={RESET_EXPIRED:'This password reset link has expired.',RESET_REVOKED:'This password reset link has been revoked.',RESET_ALREADY_USED:'This password reset link has already been used.',RESET_NOT_FOUND:'This password reset link is invalid.'};
    fail(map[e.code]||`Unable to validate reset link: ${e.code||e.message}`);
  }
}
$('save').onclick=async()=>{
  const password=$('password').value,confirm=$('confirm').value;
  if(password!==confirm)return fail('Passwords do not match.');
  if(password.length<12)return fail('Password must be at least 12 characters.');
  $('save').disabled=true;
  try{
    const j=await api(`/api/password-resets/${encodeURIComponent(token)}/accept`,{method:'POST',body:JSON.stringify({password})});
    $('status').className='status ok';$('status').textContent='Password updated. You are signed in.';
    setTimeout(()=>{location.href=j.redirect||'/'},700);
  }catch(e){
    $('status').className='status bad';$('status').textContent=`Unable to reset password: ${e.code||e.message}`;$('save').disabled=false;
  }
};
validate();
</script>
</body>
</html>
